<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobFill</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <img src="../../../icons/icon-32.png" alt="" width="22" height="22" />
        <span class="popup__name">JobFill</span>
        <span class="jf-mono popup__site" id="site"></span>
        <!-- Always reachable: an empty profile is the most likely reason
             JobFill has nothing to offer, and the fix lives one click away. -->
        <button type="button" id="open-options" class="popup__gear" title="Edit your profile">Profile</button>
      </header>

      <!--
        One region, swapped between states: scanning, preview, result, error.
        The preview is the safety check the whole manual-trigger design rests
        on, so it shows every value before anything is written.
      -->
      <div id="body" class="popup__body" role="status" aria-live="polite"></div>

      <footer class="popup__footer" id="footer"></footer>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
