<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobFill</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <img src="../../../icons/icon-32.png" alt="" width="28" height="28" />
        <div>
          <h1>JobFill</h1>
          <p class="jf-muted popup__tagline">Local-only application autofill</p>
        </div>
      </header>

      <!--
        The scan/preview/fill interface replaces this section in phase 5. Until
        then the popup is honest about what it can do rather than showing a Fill
        button that does nothing.
      -->
      <section class="popup__body">
        <p>Form scanning arrives in a later build. Set up your profile now so it is ready.</p>
      </section>

      <footer class="popup__footer">
        <button id="open-options" class="jf-button jf-button--primary" type="button">
          Set up your profile
        </button>
      </footer>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
