<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobFill — Your profile</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__brand">
        <img src="../../../icons/icon-32.png" alt="" width="24" height="24" />
        <span class="topbar__name">JobFill</span>
      </div>

      <!--
        Deliberately understated. The privacy claim is the reason this project
        exists, so it sits permanently in the chrome rather than as a dismissible
        banner — but stated as fact, not sold.
      -->
      <p class="topbar__privacy jf-mono">
        <span class="topbar__dot" aria-hidden="true"></span>
        stored on this device · never uploaded
      </p>

      <p class="topbar__status jf-mono" id="save-status" role="status" aria-live="polite"></p>
    </header>

    <div class="shell">
      <!-- Section rail. Populated by options.js from the schema. -->
      <nav class="rail" id="rail" aria-label="Profile sections"></nav>

      <!-- Active panel. Only one section is shown at a time, so no screen ever
           presents more than a dozen fields at once. -->
      <main class="panel" id="panel" tabindex="-1"></main>
    </div>

    <script src="options.js" type="module"></script>
  </body>
</html>
